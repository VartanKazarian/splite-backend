name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Reject invisible characters in tracked paths
        run: |
          if git ls-files -z | tr '\0' '\n' | LC_ALL=C grep -nP '\xE2\x81[\xA0-\xAF]|\xE2\x80[\x8B-\x8F]|\xEF\xBB\xBF'; then
            echo "::error::Tracked path contains invisible Unicode characters"
            exit 1
          fi

      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must never be committed"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build . -t splite-backend:test
