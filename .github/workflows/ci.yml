name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        # Deliberately no `|| npm install` fallback: that hides lockfile drift
        # and lets CI silently resolve versions this repository never pinned,
        # which is exactly how a suite passes locally and fails here.
        run: npm ci

      - name: Environment
        run: |
          node --version
          npm --version
          npm ls --depth=0 || true

      - name: Syntax check
        run: npm run lint

      - name: OpenAPI artifact is current
        # The committed spec is what a frontend generates its client from, so
        # it must not drift from the code that produces it.
        run: npm run openapi:check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Reject invisible characters in tracked paths
        run: npm run check:paths

      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must never be committed"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splite
          POSTGRES_PASSWORD: splite_ci_password
          POSTGRES_DB: splite_test
        options: >-
          --health-cmd "pg_isready -U splite -d splite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://splite:splite_ci_password@localhost:5432/splite_test
      DB_SSL: 'false'
      REDIS_URL: redis://localhost:6379
      RUN_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        # Deliberately no `|| npm install` fallback: that hides lockfile drift
        # and lets CI silently resolve versions this repository never pinned,
        # which is exactly how a suite passes locally and fails here.
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      # Re-running must be a no-op. Migrations are guarded by an advisory lock
      # and a schema_migrations ledger; a second run proves both, and would
      # catch a migration that is not safely re-appliable.
      - name: Re-apply migrations (idempotency check)
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build . -t splite-backend:test
