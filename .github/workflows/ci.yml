name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        # Deliberately no `|| npm install` fallback: that hides lockfile drift
        # and lets CI silently resolve versions this repository never pinned,
        # which is exactly how a suite passes locally and fails here.
        run: npm ci

      - name: Environment
        run: |
          node --version
          npm --version
          npm ls --depth=0 || true

      - name: Lint
        # ESLint, which parses *and* checks: an unused variable, a shadowed
        # binding or an assignment to an undeclared name now fails the build.
        # This step used to be `node --check`, which only parsed.
        run: npm run lint

      - name: OpenAPI artifact is current
        # The committed spec is what a frontend generates its client from, so
        # it must not drift from the code that produces it.
        run: npm run openapi:check

      - name: Unit tests
        run: npm test

      # Two audits, because they answer different questions and only one of
      # them should be able to stop a deploy.
      #
      # The image is built with `npm ci --omit=dev`, so production dependencies
      # are what actually reaches a diner's payment. A high-severity advisory
      # there is a real exposure in a service that moves money, and this fails
      # the build for it -- which is the point, and was previously impossible:
      # the step carried `continue-on-error: true`, so a critical advisory in
      # `pg` was reported in a log nobody reads and the build went green.
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Everything else -- eslint, nodemon, qrcode -- never leaves a developer's
      # machine or the CI runner. Worth seeing, and deliberately not worth
      # holding up a payment fix for: a moderate advisory in a linter blocking a
      # deploy is a rule that gets switched off the first week it fires.
      - name: Dependency audit (everything, advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Reject invisible characters in tracked paths
        run: npm run check:paths

      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must never be committed"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splite
          POSTGRES_PASSWORD: splite_ci_password
          POSTGRES_DB: splite_test
        options: >-
          --health-cmd "pg_isready -U splite -d splite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://splite:splite_ci_password@localhost:5432/splite_test
      DB_SSL: 'false'
      REDIS_URL: redis://localhost:6379
      RUN_INTEGRATION: '1'
      # A throwaway ring so the second-factor suite can seal a secret. It
      # protects nothing: the database it writes to is destroyed with the job.
      # Deliberately literal rather than a repository secret, so a fork's CI
      # runs the same tests as ours.
      MFA_SECRET_KEYS: '1:Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE='
      MFA_ACTIVE_KEY_VERSION: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        # Deliberately no `|| npm install` fallback: that hides lockfile drift
        # and lets CI silently resolve versions this repository never pinned,
        # which is exactly how a suite passes locally and fails here.
        run: npm ci

      # The runtime image installs poppler-utils for pdftoppm, which rasterises
      # an uploaded menu PDF. The integration job runs on the bare runner, so it
      # needs the same tool or the PDF path is untested here while shipping in
      # the image.
      - name: Install poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Apply migrations
        run: npm run migrate

      # Re-running must be a no-op. Migrations are guarded by an advisory lock
      # and a schema_migrations ledger; a second run proves both, and would
      # catch a migration that is not safely re-appliable.
      - name: Re-apply migrations (idempotency check)
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build . -t splite-backend:test
